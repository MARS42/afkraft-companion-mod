plugins {
	id 'dev.kikugie.stonecutter'
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'net.neoforged.moddev' version "${moddev_version}" apply false
	id 'me.modmuss50.mod-publish-plugin' version "${mod_publish_version}" apply false
}

stonecutter.active '26.3' /* [SC] DO NOT EDIT */

version = project.mod_version
group = project.maven_group

ext.extractReleaseChangelog = { String targetVersion ->
	def changelogFile = rootProject.file("CHANGELOG.md")
	if (!changelogFile.isFile()) {
		return "Release ${targetVersion}"
	}
	def lines = changelogFile.readLines("UTF-8")
	def headerPrefix = "## [${targetVersion}]"
	def capturing = false
	def body = []
	for (String line : lines) {
		if (line.startsWith("## [")) {
			if (capturing) {
				break
			}
			if (line.startsWith(headerPrefix)) {
				capturing = true
			}
			continue
		}
		if (capturing) {
			body.add(line)
		}
	}
	def text = body.join("\n").trim()
	return text ? text : "Release ${targetVersion}"
}

stonecutter.parameters {
	replacements.string(stonecutter.eval(current.version, '<1.21.11')) {
		replace 'Identifier', 'ResourceLocation'
	}
}

def mcVersions = file('versions').listFiles()
	?.findAll { it.isDirectory() && new File(it, 'gradle.properties').isFile() }
	?.collect { it.name }
	?.sort { a, b -> stonecutter.compare(a, b) } ?: []

evaluationDependsOn(':domain')
mcVersions.each { ver ->
	evaluationDependsOn(":common:${ver}")
	evaluationDependsOn(":fabric:${ver}")
	evaluationDependsOn(":neoforge:${ver}")
}

tasks.register("clean", Delete) {
	group = "build"
	description = "Deletes the root build directory."
	delete(layout.buildDirectory)
}

def chiseledTest = tasks.register("chiseledTest") {
	group = "verification"
	description = "Runs unit and architecture tests across :domain and all configured Minecraft version nodes."
	dependsOn(":domain:test")
	mcVersions.each { ver ->
		dependsOn(":common:${ver}:test", ":neoforge:${ver}:test")
	}
}

def collectArtifacts = tasks.register("collectArtifacts", Copy) {
	group = "build"
	description = "Collects built Fabric and NeoForge release and sources JARs across all Minecraft versions into root build/libs."
	duplicatesStrategy = DuplicatesStrategy.FAIL
	mcVersions.each { ver ->
		def fabricProj = project(":fabric:${ver}")
		def neoforgeProj = project(":neoforge:${ver}")
		dependsOn("${fabricProj.path}:build", "${neoforgeProj.path}:build")
		from(fabricProj.tasks.named(fabricProj.ext.productionJarTaskName as String))
		from(fabricProj.tasks.named(fabricProj.ext.productionSourcesJarTaskName as String))
		from(neoforgeProj.tasks.named("jar"))
		from(neoforgeProj.tasks.named("sourcesJar"))
	}
	into(layout.buildDirectory.dir("libs"))
}

def chiseledBuild = tasks.register("chiseledBuild") {
	group = "build"
	description = "Builds, verifies, and collects artifacts for all loaders and configured Minecraft versions."
	dependsOn(":domain:check", chiseledTest, collectArtifacts)
	mcVersions.each { ver ->
		dependsOn(":common:${ver}:check", ":fabric:${ver}:build", ":neoforge:${ver}:build")
	}
}

tasks.register("publishAllMods") {
	group = "publishing"
	description = "Publishes (or dry-runs with -PdryRun=true) all 20 Fabric and NeoForge artifacts across configured platforms."
	mcVersions.each { ver ->
		dependsOn(":fabric:${ver}:publishMods", ":neoforge:${ver}:publishMods")
	}
}

tasks.register("check") {
	group = "verification"
	description = "Runs all checks across :domain and versioned nodes."
	dependsOn(chiseledTest)
}

tasks.register("assemble") {
	group = "build"
	description = "Assembles and collects all loader artifacts."
	dependsOn(collectArtifacts)
}

tasks.register("build") {
	group = "build"
	description = "Assembles and tests all loaders and configured Minecraft versions."
	dependsOn(chiseledBuild)
}
