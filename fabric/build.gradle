import me.modmuss50.mpp.ReleaseType

plugins {
	id 'dev.kikugie.stonecutter'
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin'
}

def isObfuscated = stonecutter.eval(stonecutter.current.version, '<26.0')
apply plugin: isObfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

def javaVersion = project.java_version as int
def mcVer = stonecutter.current.project

ext.productionJarTaskName = isObfuscated ? 'remapJar' : 'jar'
ext.productionSourcesJarTaskName = isObfuscated ? 'remapSourcesJar' : 'sourcesJar'

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = "afkraft_companion-fabric"
}

repositories {
	mavenCentral()
}

evaluationDependsOn(':domain')
evaluationDependsOn(":common:${mcVer}")

def commonProject = project(":common:${mcVer}")

loom {
	splitEnvironmentSourceSets()

	mods {
		"afkraft_companion" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
			sourceSet project(":domain").sourceSets.main
		}
	}

	runs {
		client {
			client()
			name = "Fabric Client (${project.minecraft_version})"
			ideConfigGenerated(true)
			runDir = "run"
		}
		server {
			server()
			name = "Fabric Server (${project.minecraft_version})"
			ideConfigGenerated(true)
			runDir = "run"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (isObfuscated) {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	} else {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}

	implementation(project(":domain")) {
		transitive = false
	}
	clientImplementation(project(":domain")) {
		transitive = false
	}

	clientRuntimeOnly "com.google.zxing:core:3.5.3"
	include "com.google.zxing:core:3.5.3"
}

tasks.named("compileJava", JavaCompile).configure {
	if (!stonecutter.current.isActive) {
		dependsOn(commonProject.tasks.named('stonecutterGenerate'))
	}
	source(commonProject.sourceSets.main.allJava)
}

tasks.named("compileClientJava", JavaCompile).configure {
	if (!stonecutter.current.isActive) {
		dependsOn(commonProject.tasks.named('stonecutterGenerateClient'))
	}
	source(commonProject.sourceSets.client.allJava)
}

tasks.named("processResources", ProcessResources).configure {
	if (!stonecutter.current.isActive) {
		dependsOn(commonProject.tasks.named('stonecutterGenerate'))
	}
	def props = [
		version           : project.version,
		loader_version    : project.loader_version,
		fabric_mc_range   : project.fabric_mc_range,
		java_version      : project.java_version,
		mixin_compat_level: project.mixin_compat_level
	]
	inputs.properties(props)

	from(commonProject.sourceSets.main.resources)
	duplicatesStrategy = DuplicatesStrategy.FAIL

	filesMatching(["fabric.mod.json", "afkraft_companion.mixins.json"]) {
		expand(props)
	}
}

tasks.named("processClientResources", ProcessResources).configure {
	if (!stonecutter.current.isActive) {
		dependsOn(commonProject.tasks.named('stonecutterGenerateClient'))
	}
	def props = [
		mixin_compat_level: project.mixin_compat_level
	]
	inputs.properties(props)

	from(commonProject.sourceSets.client.resources)
	duplicatesStrategy = DuplicatesStrategy.FAIL

	filesMatching("afkraft_companion.client.mixins.json") {
		expand(props)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(javaVersion)
	}
	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
	def projectName = rootProject.name
	inputs.property "projectName", projectName

	duplicatesStrategy = DuplicatesStrategy.FAIL
	from(project(":domain").sourceSets.main.output)

	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName" }
	}
	from(rootProject.file("NOTICE")) {
		rename { "${it}_$projectName" }
	}
	from(rootProject.file("THIRD_PARTY_LICENSES/Apache-2.0.txt")) {
		into("META-INF/licenses")
		rename { "Apache-2.0-ZXing.txt" }
	}
}

tasks.named("sourcesJar", Jar).configure {
	if (!stonecutter.current.isActive) {
		dependsOn(
			commonProject.tasks.named('stonecutterGenerate'),
			commonProject.tasks.named('stonecutterGenerateClient')
		)
	}
	duplicatesStrategy = DuplicatesStrategy.FAIL
	from(project(":domain").sourceSets.main.allSource)
	from(commonProject.sourceSets.main.allSource)
	from(commonProject.sourceSets.client.allSource)
}

def publishDryRunFlag = providers.gradleProperty("dryRun").map { it.toBoolean() }.getOrElse(false)
def publishEnableModrinth = providers.gradleProperty("enableModrinth").map { it.toBoolean() }.getOrElse(true)
def publishEnableCurseforge = providers.gradleProperty("enableCurseforge").map { it.toBoolean() }.getOrElse(true)
def publishMrId = providers.environmentVariable("MODRINTH_PROJECT_ID").orNull
def publishCfId = providers.environmentVariable("CURSEFORGE_PROJECT_ID").orNull
def publishMrToken = providers.environmentVariable("MODRINTH_TOKEN").orNull
def publishCfToken = providers.environmentVariable("CURSEFORGE_TOKEN").orNull
def effectiveDryRun = publishDryRunFlag || (!publishMrToken && !publishCfToken)
def fabricProdJarTask = ext.productionJarTaskName as String
def fabricProdSourcesJarTask = ext.productionSourcesJarTaskName as String
def fabricMcPublishList = (project.publish_fabric_versions as String).split(',').collect { it.trim() }.findAll { !it.isEmpty() }
def lowerModVer = (project.mod_version as String).toLowerCase(Locale.ROOT)
def resolvedReleaseType = lowerModVer.contains("-alpha") ? ReleaseType.ALPHA
	: (lowerModVer.contains("-beta") || lowerModVer.contains("-rc") ? ReleaseType.BETA : ReleaseType.STABLE)

publishMods {
	dryRun = effectiveDryRun

	file = project.tasks.named(fabricProdJarTask).flatMap { it.archiveFile }
	additionalFiles.from(project.tasks.named(fabricProdSourcesJarTask).flatMap { it.archiveFile })
	displayName = "AFKraft Companion ${project.mod_version} (Fabric ${project.minecraft_version})"
	version = "${project.mod_version}+fabric-${project.minecraft_version}"
	changelog = rootProject.ext.extractReleaseChangelog(project.mod_version as String)
	type = resolvedReleaseType
	modLoaders.add("fabric")

	if (publishEnableModrinth && (publishMrId || effectiveDryRun)) {
		modrinth {
			projectId = publishMrId ?: "dry-run-modrinth-id"
			accessToken = project.providers.environmentVariable("MODRINTH_TOKEN").orElse("dry-run-token")
			minecraftVersions.addAll(fabricMcPublishList)
			requires("fabric-api")
		}
	}

	if (publishEnableCurseforge && (publishCfId || effectiveDryRun)) {
		curseforge {
			projectId = publishCfId ?: "000000"
			accessToken = project.providers.environmentVariable("CURSEFORGE_TOKEN").orElse("dry-run-token")
			minecraftVersions.addAll(fabricMcPublishList)
			javaVersions.add(JavaVersion.toVersion(javaVersion))
			clientRequired = true
			serverRequired = true
			requires("fabric-api")
		}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
