plugins {
	id 'base'
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

version = project.mod_version
group = project.maven_group

evaluationDependsOn(':domain')
evaluationDependsOn(':common')
evaluationDependsOn(':fabric')

def collectArtifacts = tasks.register("collectArtifacts", Copy) {
	group = "build"
	description = "Collects built loader artifacts into root build/libs."
	dependsOn(":fabric:build")
	from(project(":fabric").tasks.named("jar"))
	from(project(":fabric").tasks.named("sourcesJar"))
	into(layout.buildDirectory.dir("libs"))
}

tasks.named("check") {
	dependsOn(":domain:check", ":common:check", ":fabric:check")
}

tasks.named("assemble") {
	dependsOn(":domain:assemble", ":common:assemble", ":fabric:assemble", collectArtifacts)
}

tasks.named("build") {
	dependsOn(collectArtifacts)
}
